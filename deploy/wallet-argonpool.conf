# wallet.argonpool.com — the wallet gets its own origin so nothing served from the
# pool pages can read its localStorage or register a service worker over it.
# Everything this origin serves is the wallet: one HTML file and one bundle.
server {
    listen 80;
    listen [::]:80;
    server_name wallet.argonpool.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.argonpool.com;

    ssl_certificate     /etc/letsencrypt/live/wallet.argonpool.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wallet.argonpool.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/argonpool-wallet;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; worker-src 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # revalidate every load: a stale copy here would pin the old bundle for hours
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/wallet/ {
        limit_req zone=wallet burst=20 nodelay;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /var/log/nginx/wallet-access.log;
    error_log  /var/log/nginx/wallet-error.log;
}
