<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miners · argonpool.com</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#0a0a0a; --panel:#121212; --line:#262626; --line2:#343434;
    --fg:#fff; --mid:#bcbcbc; --dim:gray;
    --g:#87ff87; --glow:#d7ffd7; --c:#69d6ff; --y:#ffc66d; --r:#ff6b7a;
    --font:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg)}
  body{margin:0;color:var(--mid);font:13px/1.65 var(--font);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none} a:hover{color:var(--g)}
  .top{display:flex;align-items:center;gap:14px;height:46px;padding:0 18px;border-bottom:1px solid var(--line);
       position:sticky;top:0;background:var(--bg);z-index:20}
  .brand{color:var(--fg);font-weight:500;display:flex;align-items:center;gap:10px;white-space:nowrap}
  .brand svg{display:block}
  .top nav{display:flex;gap:16px;font-size:12px;color:var(--dim)}
  .top nav a.on{color:var(--g)}
  .search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;
          background:#0d0d0d;padding:4px 8px;min-width:0}
  .search input{background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:12px;width:190px}
  .search input::placeholder{color:#5a5a5a}
  .search button{background:none;border:0;color:var(--g);font:inherit;font-size:12px;cursor:pointer;padding:0 2px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--mid)}
  .grow{flex:1}
  .lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--dim);font:inherit;font-size:11px;padding:3px 8px;cursor:pointer}
  .lang button.on{background:#87ff871a;color:var(--g)}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 50px}
  h1{color:var(--fg);font-size:24px;font-weight:600;margin:6px 0 18px}
  .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:700px){
    .big{font-size:20px;white-space:nowrap;word-break:normal;overflow-wrap:anywhere}
    /* five columns do not fit 390px: every row becomes its own little card */
    .tbl table{min-width:0;width:100%}
    .tbl thead{display:none}
    .tbl tr{display:block;padding:10px 0;border-bottom:1px solid #1b1b1b}
    .tbl td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
            border:0;padding:2px 0;text-align:right}
    .tbl td::before{content:attr(data-label);color:var(--dim);font-size:10px;
                    letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
    .tbl td.empty{justify-content:center}
    .tbl td.empty::before{content:""}
  }
  .card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px 16px}
  .lbl{font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
  .big{color:var(--fg);font-size:26px;font-weight:500;line-height:1.3;margin-top:6px;word-break:break-all}
  .big.g{color:var(--g)}
  .sub{font-size:11px;color:#6c6c6c;margin-top:2px}
  .head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);
        padding:0 0 10px;margin:22px 0 0;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .tag{border:1px solid var(--line);border-radius:3px;padding:0 6px;color:var(--mid);letter-spacing:0;text-transform:none}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-weight:400;color:var(--dim);font-size:11px;letter-spacing:.06em;
     text-transform:uppercase;padding:9px 4px;border-bottom:1px solid var(--line)}
  td{padding:9px 4px;border-bottom:1px solid #1b1b1b;color:var(--mid)}
  td.n,th.n{text-align:right}
  td.mono{color:var(--fg)}
  .empty{text-align:center;color:#5a5a5a;padding:22px 0}
  .foot{color:#5a5a5a;font-size:11.5px;margin-top:18px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px #87ff8799;margin-right:6px}
  .dot.off{background:#555;box-shadow:none}

  .jserr{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#5c1b1b;color:#ffdede;
    font:12px/1.5 ui-monospace,Menlo,monospace;padding:8px 12px;border-top:1px solid #ff6b6b}
  /* ---- same motion vocabulary as the pool page ---- */
  @keyframes nebPulse{0%,100%{box-shadow:0 0 0 0 #87ff8766,0 0 8px #87ff8799}50%{box-shadow:0 0 0 4px #87ff8700,0 0 8px #87ff8766}}
  @keyframes nebRowIn{0%{opacity:0;background:#87ff8730;transform:translateX(-16px)}60%{background:#87ff8718}100%{opacity:1;background:transparent;transform:none}}
  @keyframes nebtick{0%{color:var(--g);transform:translateY(-3px)}100%{color:inherit;transform:none}}
  @keyframes nebEnter{0%{opacity:0;transform:translateY(7px)}100%{opacity:1;transform:none}}
  .dot{animation:nebPulse 2.6s ease-in-out infinite}
  .card{animation:nebEnter .42s cubic-bezier(.2,.7,.3,1) both}
  tr.rowIn{animation:nebRowIn .95s ease-out both}
  .tick{animation:nebtick .55s ease-out}
  /* phones: the header used to be one rigid row, which pushed the whole layout
     wider than the screen and made the page look zoomed in. Rows wrap now, the
     nav keeps scrolling sideways, the search takes a full line. */
  @media (max-width:700px){
    .top{height:auto;flex-wrap:wrap;gap:8px 10px;padding:8px 12px}
    .top .grow{display:none}
    .brand{order:1}
    .lang{order:2;margin-left:auto}
    .top nav{order:3;width:100%;display:flex;gap:16px;white-space:nowrap;overflow-x:auto;
             padding-top:8px;border-top:1px solid var(--line);scrollbar-width:none}
    .top nav::-webkit-scrollbar{display:none}
    .top nav a{flex:0 0 auto;white-space:nowrap}
    .search{order:4;width:100%;box-sizing:border-box}
    .search input{width:100%;min-width:0;flex:1 1 auto}
    .lang button{padding:5px 10px;font-size:12px}
    .search button{flex:0 0 auto;white-space:nowrap}
  }
  @media (prefers-reduced-motion: reduce){ .dot,.card,tr.rowIn,.tick{animation:none !important} }
</style>

<div class="top">
  <a class="brand" href="/">
    <svg width="16" height="18" viewBox="0 0 24 26" aria-hidden="true">
      <polygon points="12,0 23,6 12,12 1,6" fill="#d7ffd7"/>
      <polygon points="1,6 12,12 12,25 1,19" fill="#87ff87"/>
      <polygon points="12,12 23,6 23,19 12,25" fill="#4fd14f"/>
    </svg>
    <span>neb pool</span>
    <span class="pill">mainnet</span>
  </a>
  <nav><a href="/" data-i18n="nav_pool">矿池</a><a href="/miners.html" class="on" data-i18n="nav_miners">矿工</a><a href="/#blocks" data-i18n="nav_blocks">出块</a><a href="/wallet/" data-i18n="nav_wallet">钱包</a></nav>
  <span class="grow"></span>
  <div class="search">
    <input id="q" placeholder="搜索地址 neb1…" autocomplete="off" spellcheck="false">
    <button id="qbtn">查询</button>
  </div>
  <div class="lang">
    <button data-lang="zh" class="on">中文</button>
    <button data-lang="en">EN</button>
  </div>
</div>

<div class="wrap">
  <h1 id="h1">矿工与算力</h1>

  <div class="grid">
    <div class="card">
      <div class="lbl" id="l-net">全网算力</div>
      <div class="big" id="net">–</div>
      <div class="sub" id="s-net">难度 ÷ 60 秒</div>
    </div>
    <div class="card">
      <div class="lbl" id="l-pool">本池算力</div>
      <div class="big g" id="pool">–</div>
      <div class="sub" id="s-pool">最近 5 分钟</div>
    </div>
    <div class="card">
      <div class="lbl" id="l-share">本池占比</div>
      <div class="big" id="share">–</div>
      <div class="sub" id="s-share">占全网算力</div>
    </div>
    <div class="card">
      <div class="lbl" id="l-miners">矿工 / 连接</div>
      <div class="big" id="miners">0</div>
      <div class="sub" id="s-miners">高度 —</div>
    </div>
  </div>

  <div class="head"><span id="l-rows">矿工</span><span class="tag" id="tag-shares">–</span></div>
  <div class="tbl"><table>
    <thead><tr>
      <th id="th-addr">地址</th><th>rig</th>
      <th class="n" id="th-shares">share</th>
      <th class="n" id="th-hash">算力</th>
      <th class="n" id="th-last">最近 share</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty" id="empty">还没有矿工接入</td></tr></tbody>
  </table></div>

  <div class="head"><span id="l-blocks">出块</span><span class="tag" id="tag-blocks">0</span></div>
  <div class="tbl"><table>
    <thead><tr>
      <th class="n" id="th-h">高度</th><th class="n" id="th-time">时间</th>
      <th class="n" id="th-reward">奖励</th><th class="n" id="th-sharecount">share</th>
    </tr></thead>
    <tbody id="blocks"><tr><td colspan="4" class="empty" id="empty-blocks">等待第一个块</td></tr></tbody>
  </table></div>

  <p class="foot" id="foot">数据每 5 秒刷新一次，全部来自矿池自己的账本；地址即账号，不用注册。</p>
</div>

<script>
const I18N = {
  zh: {
    h1: "矿工与算力", back: "← 返回矿池",
    l_net: "全网算力", s_net: "难度 ÷ 60 秒", l_pool: "本池算力", s_pool: "最近 5 分钟",
    l_share: "本池占比", s_share: "占全网算力", l_miners: "矿工 / 连接", s_miners: (h) => "高度 " + h,
    l_rows: "矿工", l_blocks: "出块", th_addr: "地址", th_shares: "share", th_hash: "算力",
    th_last: "最近 share", th_h: "高度", th_time: "时间", th_reward: "奖励", th_sharecount: "share",
    empty: "还没有矿工接入", empty_blocks: "等待第一个块", offline: "· 离线", tag_shares: (n) => n + " shares",
    foot: "数据每 5 秒刷新一次，全部来自矿池自己的账本；地址即账号，不用注册。",
    pool_pill: "NEB · mainnet"
  },
  en: {
    h1: "Miners & hashrate", back: "← back to pool",
    l_net: "network hashrate", s_net: "difficulty ÷ 60 s", l_pool: "this pool", s_pool: "last 5 minutes",
    l_share: "pool share", s_share: "of the network", l_miners: "miners / conns", s_miners: (h) => "height " + h,
    l_rows: "miners", l_blocks: "blocks", th_addr: "address", th_shares: "shares", th_hash: "hashrate",
    th_last: "last share", th_h: "height", th_time: "time", th_reward: "reward", th_sharecount: "shares",
    empty: "no miner yet", empty_blocks: "waiting for the first block", offline: "· offline", tag_shares: (n) => n + " shares",
    foot: "Refreshed every 5 s from the pool's own ledger. Your address is your account, no sign-up.",
    pool_pill: "NEB · mainnet"
  }
};

let LANG = localStorage.getItem("nebpool-lang") || "zh";
const $ = (id) => document.getElementById(id);
const hdr = (id) => (($(id) || {}).textContent || "").trim();

function fmtHash(h) {
  if (h === null || h === undefined) return "–";   // nothing loaded yet
  if (h <= 0) return "0 H/s";                     // a pool with no miners has zero, not "unknown"

  const u = [[1e12,"TH/s"],[1e9,"GH/s"],[1e6,"MH/s"],[1e3,"kH/s"]];
  for (const [v, s] of u) if (h >= v) return (h / v).toFixed(2) + " " + s;
  return h.toFixed(0) + " H/s";
}
function nfmt(n) { return (n || 0).toLocaleString("en-US"); }
function short(a) { return a.length > 22 ? a.slice(0, 10) + "…" + a.slice(-6) : a; }
function ago(ts) {
  if (!ts) return "–";
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  return Math.floor(s / 3600) + "h";
}
function esc(t) { return String(t).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function applyLang() {
  const d = I18N[LANG];
  document.documentElement.lang = LANG === "zh" ? "zh" : "en";
  document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === LANG));
  // Elements come and go as the page is shared with the pool page; a missing id
  // used to throw here and stop the refresh loop dead, leaving every tile blank.
  const put = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  put("h1", d.h1);
  put("l-net", d.l_net); put("s-net", d.s_net);
  put("l-pool", d.l_pool); put("s-pool", d.s_pool);
  put("l-share", d.l_share); put("s-share", d.s_share);
  put("l-miners", d.l_miners);
  put("l-rows", d.l_rows); put("l-blocks", d.l_blocks);
  put("th-addr", d.th_addr); put("th-shares", d.th_shares);
  put("th-hash", d.th_hash); put("th-last", d.th_last);
  put("th-h", d.th_h); put("th-time", d.th_time);
  put("th-reward", d.th_reward); put("th-sharecount", d.th_sharecount);
  put("foot", d.foot);
  if (LAST) render(LAST);
}

let LAST = null;
function setNum(id, v) {
  const e = document.getElementById(id);
  if (!e) return;
  const next = String(v);
  if (e.textContent === next) return;
  e.textContent = next;
  e.classList.remove("tick"); void e.offsetWidth; e.classList.add("tick");
}

let LAST_TOP = null;
function render(d) {
  const t = I18N[LANG];
  setNum("net", fmtHash(d.network_hashrate || 0));
  setNum("pool", fmtHash(d.hashrate));
  // 0 is a real answer here: no miner connected means zero, and a dash reads as broken
  setNum("share", d.pool_share === null || d.pool_share === undefined
    ? "–" : (d.pool_share * 100).toFixed(3) + " %");
  const all = d.workers || [];
  const live = all.filter((w) => w.online || w.conns > 0);
  const conns = all.reduce((x, w) => x + (w.conns || 0), 0);
  setNum("miners", live.length + (conns ? " / " + conns : ""));
  $("s-miners").textContent = t.s_miners(d.height === null || d.height === undefined ? "–" : d.height);

  const rows = $("rows");
  rows.textContent = "";
  const ws = (d.workers || []).filter((w) => w.account !== "unattributed");
  $("tag-shares").textContent = t.tag_shares(nfmt(ws.reduce((x, w) => x + (w.shares || 0), 0)));
  if (!ws.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5; td.className = "empty"; td.textContent = t.empty;
    tr.appendChild(td); rows.appendChild(tr);
  } else {
    ws.sort((a, b) => (b.hashrate || 0) - (a.hashrate || 0)).forEach((w) => {
      const tr = document.createElement("tr");
      const cells = [
        { text: short(w.account), mono: true, title: w.account },
        { text: (w.rig || "–") + (w.online || w.conns ? "" : " " + t.offline) },
        { text: nfmt(w.shares), n: true },
        { text: (w.online || w.conns) ? fmtHash(w.hashrate)
                : (w.hashrate > 0 ? fmtHash(w.hashrate) : "–"), n: true, mono: true },
        { text: ago(w.last_share), n: true },
      ];
      const labels = [hdr("th-addr"), "rig", hdr("th-shares"), hdr("th-hash"), hdr("th-last")];
      cells.forEach((c, i) => {
        const td = document.createElement("td");
        td.textContent = c.text;
        td.dataset.label = labels[i] || "";
        if (c.n) td.className = "n";
        if (c.mono) td.classList.add("mono");
        if (c.title) td.title = c.title;
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
  }

  const bb = $("blocks");
  bb.textContent = "";
  const blocks = d.blocks || [];
  $("tag-blocks").textContent = blocks.length;
  if (!blocks.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4; td.className = "empty"; td.textContent = t.empty_blocks;
    tr.appendChild(td); bb.appendChild(tr);
  } else {
    const topNow = blocks[0].height;
    const isNew = LAST_TOP !== null && topNow > LAST_TOP;
    LAST_TOP = topNow;
    blocks.slice(0, 20).forEach((b, idx) => {
      const tr = document.createElement("tr");
      if (idx === 0 && isNew) tr.className = "rowIn";
      [[String(b.height), "n mono"], [new Date((b.ts || 0) * 1000).toLocaleString(), "n"],
       [((b.reward || 0) / 1e8).toFixed(2) + " NEB", "n"], [String(b.shares || 0), "n"]]
        .forEach(([text, cls], i) => {
          const td = document.createElement("td");
          td.textContent = text;
          td.dataset.label = [hdr("th-h"), hdr("th-time"), hdr("th-reward"), hdr("th-sharecount")][i] || "";
          if (cls) td.className = cls;
          tr.appendChild(td);
        });
      bb.appendChild(tr);
    });
  }
}

async function tick() {
  try {
    const r = await fetch("/api/stats", { cache: "no-store" });
    LAST = await r.json();
    render(LAST);
  } catch (e) { /* keep the last numbers */ }
}

document.querySelectorAll(".lang button").forEach((b) => {
  b.onclick = () => { LANG = b.dataset.lang; localStorage.setItem("nebpool-lang", LANG); applyLang(); };
});
const runSearch = () => {
  const q = document.getElementById("q").value.trim();
  if (q) location.href = "/?q=" + encodeURIComponent(q);
};
document.getElementById("qbtn").onclick = runSearch;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

applyLang();
tick();
setInterval(tick, 5000);
</script>
</html>
