<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NEB 钱包 · 正在迁移</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#08090b;color:#e8eaed;
       font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:24px}
  main{width:100%;max-width:430px;border:1px solid #23262b;border-radius:14px;padding:22px 20px;background:#0d0f12}
  h1{margin:0 0 12px;font-size:16px;letter-spacing:.01em}
  p{margin:0 0 10px;color:#a9b0ba;font-size:13px}
  b{color:#e8eaed}
  .addr{color:#7fd1a6;word-break:break-all}
  button{width:100%;margin:14px 0 8px;padding:11px;border-radius:9px;border:0;background:#2b6cf6;color:#fff;
         font:inherit;font-size:13px;cursor:pointer}
  button:active{transform:translateY(1px)}
  .small{font-size:12px;color:#7d848f;margin:0}
  a{color:#7fa7ff}
  .hide{display:none}
</style>
</head>
<body>
<main id="card" class="hide">
  <h1 id="t-h"></h1>
  <p id="t-b1"></p>
  <p id="t-b2"></p>
  <button id="go"></button>
  <p class="small" id="cd"></p>
</main>
<main id="fail" class="hide">
  <h1 id="f-h"></h1>
  <p id="f-p"></p>
  <p><a href="https://wallet.argonpool.com/" id="f-a"></a></p>
</main>
<noscript>
  <p>钱包需要 JavaScript。<a href="https://wallet.argonpool.com/">前往新地址</a></p>
  <p>The wallet needs JavaScript. <a href="https://wallet.argonpool.com/">Open the new address</a></p>
</noscript>
<script src="/wallet/migrate.js"></script>
</body>
</html>
