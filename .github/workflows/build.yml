# Anyone can check that the deployed bundle matches the source: this job builds
# it from a clean checkout and prints the SHA-256 the page should be showing.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: fingerprint
        run: |
          echo "app.js sha256:" && sha256sum dist/app.js
          echo "the live page must print the same hash"
